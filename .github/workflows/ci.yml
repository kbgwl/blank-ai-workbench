name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - name: 类型检查（先 typegen：干净 clone 上没有 next-env.d.ts 与 .next/types）
        # layout.tsx 用了 Next 16 生成的全局类型 LayoutProps。这些产物在 .gitignore 里，
        # 本地因为跑过 build/dev 一直存在，所以这一格只在干净树上才红——2026-10-29 首次真跑就红了。
        # 修法是把生成那一步显式接在 tsc 前面（root 的 typecheck:web 已经带上）。
        run: pnpm typecheck:web
      - run: pnpm lint:web
      - run: pnpm build:web

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blank
          POSTGRES_PASSWORD: blank_dev_password
          POSTGRES_DB: blank
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3  # 该 action 不提供 v10 这种滚动大版本 tag，只能钉完整版本
      - name: build sandbox image
        run: docker build -t blank-sandbox:dev -f sandbox/Dockerfile sandbox
      - run: uv sync
        working-directory: services/api
      - run: uv run pytest -q
        working-directory: services/api
      - name: migrations roundtrip
        env:
          BLANK_DATABASE_URL: postgresql+asyncpg://blank:blank_dev_password@localhost:5432/blank
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
        working-directory: services/api

  api-dialect:
    # #50 量出的三类缺陷只在第二种方言上成立：提交后读回（无 INSERT RETURNING ⇒ 同步 lazy IO）、
    # 以及 aiomysql 在 PyMySQL ≥1.2 上绑不了 bytes（检查点每轮都写二进制列）。
    # SQLite 那一格全绿挡不住它们，所以这两格必须是真库；判定用同一份驱动逐格同跑：
    # 与对照格一起红 = 装置错，只有某一格红 = 真方言分歧。
    # --require-mysql / --require-postgres 让"库没起来"变成失败，而不是静默跳过（跳过 = 这一格今天没人守）。
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_only_root_pw"
          --health-interval 5s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_pg_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3  # 该 action 不提供 v10 这种滚动大版本 tag，只能钉完整版本
      - run: uv sync --extra mysql
        working-directory: services/api
      - name: 三方言端到端对照（真 HTTP；步数由装置的 EXPECTED_STEPS 自查）
        # 名字里不写死步数：写死的那份会腐烂，而"全绿"这句话需要的是装置自己对过账。
        # 仓库根没有 pyproject.toml，uv 的项目上下文就是 services/api；装置自己按 __file__ 找得到仓库。
        env:
          BLANK_E2E_MYSQL_URL: mysql+aiomysql://root:ci_only_root_pw@127.0.0.1:3306/kbgai_e2e
          BLANK_E2E_POSTGRES_URL: postgresql+asyncpg://postgres:ci_only_pg_pw@127.0.0.1:5432/kbgai_e2e
        # 装置在仓库根的 evals/ 下：这里的工作目录是 services/api，要往上两级。
        # 2026-10-29 首次真跑发现写成 ../evals 指到了 services/evals（不存在），直接退出码 2。
        run: >-
          uv run --extra mysql python ../../evals/dialect_e2e.py
          --only sqlite,mysql,postgres --require-mysql --require-postgres
        working-directory: services/api
      - name: PG 两条建库路径对账（alembic vs create_all）
        # 这一格比 HTTP 更早暴露"迁移写了、ORM 没写"的漂移：#61 第一次真跑就数出
        # 77 个列的服务端默认值只有迁移侧有。给 URL 就连不上即失败；不给才跳过。
        env:
          BLANK_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:ci_only_pg_pw@127.0.0.1:5432/postgres
        run: uv run python -m pytest -q tests/test_schema_agreement_pg_v33.py
        working-directory: services/api
      - name: MySQL 两条建库路径对账（alembic vs create_all）
        # #63：MySQL 侧自 #49 后只剩"迁移能跑通"和 HTTP，create_all 没再逐列对过。
        # 这一格比类型/长度/索引/唯一约束/外键名与 ON DELETE/服务端默认值；
        # 12 个时间列的 CURRENT_TIMESTAMP vs (now()) 是 0023 重述默认值的同义写法，用例单独钉住。
        env:
          BLANK_TEST_MYSQL_URL: mysql+aiomysql://root:ci_only_root_pw@127.0.0.1:3306/mysql
        run: uv run --extra mysql python -m pytest -q tests/test_schema_agreement_mysql_v40.py
        working-directory: services/api

  team-e2e:
    # 团队链路只有跨进程才暴露问题（审批放行后成员是否真的变化、管家挑的资料是否进了提示），
    # 单测全绿挡不住这类结论。浏览器点验需要 Chrome，CI 里先跑后端阶段，本地用 pnpm e2e:team 补全。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3  # 该 action 不提供 v10 这种滚动大版本 tag，只能钉完整版本
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
        working-directory: services/api
      - name: 团队链路后端阶段（退出码 3 = 有阶段被显式跳过，这里属预期）
        # run.mjs 用 3 表示"跑了但有阶段没跑"，好让"少跑一半"不和"全绿"同一个信号；
        # CI 没有 Chrome 才传 --skip-web，所以这一格把 3 认下来，1（有阶段红）仍然照红。
        run: |
          set +e
          node evals/team_e2e/run.mjs --skip-web
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "退出码 3：浏览器点验被 --skip-web 显式跳过，其余阶段全绿"
            exit 0
          fi
          exit "$code"

  desktop:
    # 桌面壳的单测与打包自检。
    # 单测（node --test）只读仓库文件、不装 electron、不开窗口，任何平台都能跑；
    # 打包自检必须 Windows：electron-builder 出的是 Windows 产物，verify-package 断言的
    # 是 `resources/backend/runtime/python.exe` 这类路径，在 Linux runner 上根本没有意义。
    #
    # 这一格此前一直是洞：`desktop/tests/*.test.cjs`（52 例）和 verify-package（14 项）
    # 只在打包人的机器上跑过，"能过"这件事没有任何一次是别人复现出来的。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 桌面壳单测（纯函数 + 壳的连线）
        run: pnpm test:desktop
      - name: 仓库内自洽（版本号三处一致，见 scripts/check_versions.mjs）
        run: pnpm check:versions
      - name: 评测判分器的纯函数单测
        # 判分逻辑抽成 evals/lib/judgement.mjs 就是为了能在这一格单测：
        # 以前它混在 run_evals.mjs 的 IO 里，判定对不对只能靠"跑一遍看结果"。
        run: node --test evals/tests/judgement.test.mjs

  desktop-package:
    # 打一次真包，再让 verify-package 按包内产物逐条对账。
    #
    # 这一格能成立的前提是「运行时组装」有脚本了：`desktop/build/runtime`（约 129MB）
    # 不入库、过去只能靠打包人的机器，于是"打包自检"永远无法进 CI。现在由
    # scripts/prepare_desktop_runtime.mjs 从 uv 的独立 CPython + uv.lock 现场组装，
    # 与既有那份同构（同一个 python.exe / Lib/site-packages / blank_api.pth 布局）。
    #
    # 只打 `--dir`（win-unpacked），不出 portable/NSIS 安装包：自检断言的是解包后的
    # 目录结构，出安装包既慢又要签，多出来的那两步没有额外判据。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 前端静态导出（桌面包只拷产物，不会自己构建前端）
        # 这两个变量缺一不可：少了 NEXT_PUBLIC_API_BASE，产物里的接口地址是空串，
        # 界面会去 fetch 相对路径 `/api/v1`，在 file:// 下必死——而打包日志一切正常。
        env:
          BLANK_DESKTOP_BUILD: "1"
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
        run: pnpm build:web
      - name: 组装随包 Python 运行时
        run: node scripts/prepare_desktop_runtime.mjs
      - name: 体检运行时（缺 python.exe / .pth 内容不对会在这里就红）
        run: node scripts/prepare_desktop_runtime.mjs --check
      - name: electron-builder 出 win-unpacked
        working-directory: desktop
        run: node node_modules/electron-builder/cli.js --win --dir
      - name: 打包后自检（14 项：产物齐不齐、asar 是否旧副本、包内有没有本机痕迹）
        working-directory: desktop
        run: node verify-package.cjs

  eval-gate:
    # #104：评测集成功率进门禁。用脚本化桩（scripts/mock-model-server.mjs，不烧真模型、不调真实供应商）
    # 跑 evals/task-samples.json 全集 32 例，读数装置是 evals/eval_gate.mjs——它自己那行「退出码=」才是判定：
    #   0=成功率≥实测阈值；1=有格红；2=这一格今天没法判（结果缺失/样本不足/上一轮没跑完/有记录没判出）。
    # 1 与 2 都会让这一步红：「今天没法判」绝不允许伪装成「通过」。阈值 0.938 的实测出处写在 evals/gate_config.json。
    # 2026-10-29 首次在 GitHub runner 上真跑：门禁本身绿（success_rate 0.938 ≥ 0.938，32 例、
    # T07/T29 为桩的确定形状），红的是 setup-uv@v5 的 post 步骤 uv cache prune 退出码 2——
    # 与门禁无关，已把四个 job 的 setup-uv 升到 v10.3.3（该 action 只发完整版本 tag）。本地等价复现见 scripts/local_ci.mjs --job eval-gate。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3  # 该 action 不提供 v10 这种滚动大版本 tag，只能钉完整版本
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
        working-directory: services/api
      - name: 隔离库建库（这一格量的是产品链路，不是方言，SQLite 足够）
        env:
          BLANK_DATABASE_URL: sqlite+aiosqlite:////tmp/eval_gate.db
        run: uv run alembic upgrade head
        working-directory: services/api
      - name: 起脚本化桩 + API（:8050 独立实例；姿态与桌面壳同款，无 docker 时沙箱默认开会把任务全挡死）
        # `BLANK_RATE_LIMIT_RPM=0`：这一格是**批量客户端**，32 例在几十秒内会打出 200 多个请求，
        # 撞上默认 120 rpm 之后整批变 429，门禁读出来就是"产品成功率掉了"——那是装置和限流打架。
        # 产品默认限流一个字没改（120），这里只是把这个受控实例的闸打开。
        run: |
          node scripts/mock-model-server.mjs > /tmp/mock.log 2>&1 &
          cd services/api
          BLANK_DATABASE_URL=sqlite+aiosqlite:////tmp/eval_gate.db \
          BLANK_SETTINGS_FILE=/tmp/eval_gate_settings.json \
          BLANK_SECRET_KEY_FILE=/tmp/eval_gate_secret.key \
          BLANK_SANDBOX_ENABLED=false \
          BLANK_RATE_LIMIT_RPM=0 \
          uv run uvicorn blank_api.app:app --host 127.0.0.1 --port 8050 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8050/api/v1/health | grep -q connected && exit 0
            sleep 2
          done
          echo "::error::API :8050 没起来"
          tail -50 /tmp/api.log
          exit 1
      - name: 注册脚本化桩供应商
        env:
          BLANK_API_BASE: http://127.0.0.1:8050/api/v1
        run: |
          node scripts/register_mock_provider.mjs http://127.0.0.1:8099/v1 \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).id))" \
            | xargs -I{} sh -c 'echo "PROVIDER_ID={}" >> "$GITHUB_ENV"'
      - name: 评测全集 32 例（桩）
        env:
          BLANK_API_BASE: http://127.0.0.1:8050
        run: node evals/run_evals.mjs --provider "$PROVIDER_ID" --concurrency 3
      - name: 成功率门禁（只认 eval_gate 自己那行退出码）
        run: node evals/eval_gate.mjs
