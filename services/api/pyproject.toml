[project]
name = "blank-api"
version = "0.1.0"
description = "Blank AI Workbench API service"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16.5",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.21.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blank_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
