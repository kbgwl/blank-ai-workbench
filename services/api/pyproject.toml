[project]
name = "blank-api"
version = "0.1.0"
description = "Blank AI Workbench API service"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.16.5",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.21.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# 「能换 MySQL」要能被安装才算成立：这两个驱动此前只在开发机上手装过，
# pyproject 与 uv.lock 里都没有，`uv sync` 出来的新环境连不上 MySQL。
# 上界写死在 1.3.0 之前：PyMySQL 1.3 计划删除 `escape_bytes_prefixed` 这个别名，
# aiomysql 0.3.2 还在 import 它，届时会直接 ImportError（1.2.x 由
# blank_api.db.ensure_mysql_driver_compat() 兜住，见 db.py 的说明）。
mysql = ["aiomysql>=0.3.2,<0.4", "pymysql>=1.2,<1.3"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blank_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
