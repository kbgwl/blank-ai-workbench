services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blank
      POSTGRES_PASSWORD: blank_dev_password
      POSTGRES_DB: blank
    ports:
      - "5432:5432"
    volumes:
      - blank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blank"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  blank_pgdata:
